- canonical_id: GEOMETRY.FRAMEBOX
  canonical_name: Framebox
  semantic_class: PLATFORM_TERM
  definition: Platform-owned, internal, rectangular working / reference frame of the production object.
    Initially derived from the layout box by platform interpretation; may afterwards be changed only through
    platform-approved semantics (e.g. OPERATION.KIND.DEFINE_FRAMEBOX). Downstream modules consume this
    one canonical working frame and never choose between hidden frame sources. It may coincide geometrically
    with a PDF box, the layout box, a clip region or the bounding frame of a production contour in a particular
    case, but is not semantically identical to any of them.
