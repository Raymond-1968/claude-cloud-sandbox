  - PDF.BOX.ART
  - PDF.BOX.BLEED
  - PDF.BOX.CROP
  - PDF.BOX.MEDIA
  - PDF.BOX.TRIM
  relationships:
  - type: derived_initially_from
    target: GEOMETRY.LAYOUT_BOX
  - type: established_or_modified_by
    target: OPERATION.KIND.DEFINE_FRAMEBOX
  - type: materialized_by
    target: POLICY.FRAME_MATERIALIZATION
