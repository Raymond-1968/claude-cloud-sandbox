# Impozitorium Canonical Application Semantics Registry - Baseline V1
# Data only. Deterministic ordering: entries sorted by canonical_id; mappings sorted by key.
# ambiguous_terms: bare words that MUST be qualified; they never resolve to one entry.
# Companion document: 05_CANONICAL_APPLICATION_SEMANTICS_BASELINE_V1.md
registry_id: IMPOZITORIUM_CANONICAL_APPLICATION_SEMANTICS_REGISTRY
registry_version: V1
status: BASELINE_CANDIDATE_PENDING_HUMAN_REVIEW
implementation_authorization: NONE
status_values:
- CANONICAL_V1
- DEPRECATED
- LEGACY
- NEEDS_HUMAN_DECISION
- NEEDS_STANDARD_REVIEW
- PROVISIONAL
namespaces:
  ARCHITECTURE: Meta-vocabulary for talking about the system (module vs service vs algorithm ...).
  ARTIFACT: Product artifact lifecycle concepts (owned by Platform File Management and the Working Document
    model).
  DEVINFRA: Development infrastructure (File Factory, Orchestrator Operator Workplace). Never product
    runtime.
  DIAGNOSTIC: Observation and diagnostic result semantics.
  GEOMETRY: 'Platform geometry semantics derived from PDF facts: layout basis, spaces, frames, regions.'
  GOVERNANCE: Project governance (Human authority, review, repository publication). Never product runtime.
  MODULE: Operator-facing production modules (product surfaces). Module names never name platform layers.
  OPERATION: Product-runtime operations, their records, requests, results and operation kinds.
  PDF: Standard PDF structure and PDF-standard objects (ISO 32000 family).
  PLATFORM: Platform-owned services/cores that modules use (not modules themselves).
  POLICY: Policy objects and policy-controlled decisions.
  PRODUCTION: Print-production domain concepts (intent, imposition, binding, admissibility).
  TECHNICAL_OBJECT: Non-product marks and technical content placed for production/finishing.
  UI: Human-facing interaction vocabulary (labels, actions). Labels are not machine identities.
sources:
  SRC.CIP4_JDF_XJDF: 'CIP4 JDF/XJDF: intent vs production distinction (CIP4 ''Introduction to JDF'');
    XJDF intent resources such as LayoutIntent, ProductionIntent (ISO 21812-1:2019 preview); JDF Layout
    with SignatureName/SheetName partitions, MarkObject and RegisterMark (CIP4 JDF Layout Creator to Imposition
    ICS). Detailed element definitions NOT verified.'
  SRC.DOMAIN_PRINT: Established print-production usage (e.g. creep and shingling in saddle-stitched booklets;
    trim / crop marks; bleed). Industry explanatory sources, not standards.
  SRC.HUMAN_TASK_05: 'Human/Coordinator task IMPOZITORIUM_CANONICAL_APPLICATION_SEMANTICS_BASELINE_V1_01
    (product laws: layout_box priority, GUI layout [0,0,w,h], W_obj = layout.width, gap definition, Define
    Framebox meaning)'
  SRC.ICC: 'ICC.1 profile specification; PDF OutputIntent with embedded destination output profile (secondary:
    Adobe Acrobat help on output intents, PDFlib PDF/X output intents). ICC.2 (iccMAX) not reviewed.'
  SRC.ISO15930_PDFX: ISO 15930 (PDF/X family). Secondary sources state a PDF/X file defines MediaBox plus
    TrimBox or ArtBox, BleedBox when bled, and an OutputIntent. Normative text NOT accessed.
  SRC.ISO19593_1: 'ISO 19593-1:2018 ''Graphic technology - Use of PDF to associate processing steps and
    content data - Part 1: Processing steps for packaging and labels'' (title verified via PDF Association
    and ISO catalogue listings; processing steps carried as optional content groups with groups such as
    Structural, Dimensions; normative text NOT accessed).'
  SRC.ISO32000_OPTIONAL_CONTENT: ISO 32000 optional content (OCG / OCMD / OCProperties). Normative text
    NOT accessed; identity confirmed via PDF Association material on ISO 19593-1.
  SRC.ISO32000_PAGE_BOUNDARIES: ISO 32000 (PDF 1.7 / PDF 2.0) page boundaries. Clause 'Page boundaries'
    (cited as 14.11.2 by third-party API references, e.g. setasign SetaPDF PageBoundaries, GemBox PdfPageBoundaryType).
    Normative text NOT accessed in this pass.
  SRC.ISO32000_XOBJECT: ISO 32000 form XObjects and their BBox key. Normative text NOT accessed.
  SRC.REPO_AGENTS_MD: 'mirror: AGENTS.md (OW-line and EN-line identical)'
  SRC.REPO_AGENT_BRIEFING: 'mirror: doc/agent_briefing.md (OW-line and EN-line identical)'
  SRC.REPO_AGENT_HIERARCHY: 'mirror OW-line: doc/agent_orchestration/IMPOZITORIUM_AGENT_HIERARCHY_POLICY_ACCEPTED_DERIVED_01.md'
  SRC.REPO_BOOKLET_LAB: 'mirror sandbox/booklet-folding-lab: sandbox/booklet_folding_lab/*'
  SRC.REPO_BUTTON_LANGUAGE: 'mirror: doc/platform_button_action_language.md (Draft)'
  SRC.REPO_COMMAND_API: 'mirror: doc/platform_command_api_manifesto.md (Draft)'
  SRC.REPO_CORE_NORMALIZE_BOXES: 'mirror: preflight/core.py::normalize_boxes (legacy TrimBox -> BleedBox
    -> MediaBox basis, GUI zeroing)'
  SRC.REPO_CREATE_BOOKLET: 'mirror: doc/create_booklet_*.md; sandbox/booklet_pipeline_lab/; transfer/create-booklet-backend-2026-09-30'
  SRC.REPO_DIAGNOSTICS: 'mirror: doc/platform_diagnostics_architecture.md; doc/pdf_compatibility_gate_policy.md'
  SRC.REPO_ENGINE_DECISIONS: 'mirror EN-line: doc/engine_migration_decision_d01..d08_2026_07_29.md'
  SRC.REPO_ENGINE_NEUTRAL_GEOMETRY: 'mirror EN-line: preflight/engine_neutral_geometry.py; doc/impositorium_engine_neutral_geometry_coordinate_space_diagnostic_boundary_contract.md'
  SRC.REPO_FILE_FACTORY: 'mirror OW-line: operator_workplace/canonical_core/types.py; Blueprint 08'
  SRC.REPO_FUTURE_PLACEMENT: 'mirror: doc/future_placement_modules_foundation.md (Draft)'
  SRC.REPO_GENERATED_RESULT_PROFILES: 'mirror EN-line: preflight/generated_result_profiles.py'
  SRC.REPO_MARK_REGISTRIES: 'mirror: preflight/cut_mark_profile_registry.py, signature_profile_registry.py,
    technical_font_bundle_registry.py and their runtime contracts'
  SRC.REPO_OPTIONAL_CONTENT: 'mirror OC-line: preflight/optional_content*.py; doc/pdf_optional_content_audits/*'
  SRC.REPO_ORCHESTRATOR_OW: 'mirror OW-line: doc/agent_orchestration/IMPOZITORIUM_ORCHESTRATOR_OPERATOR_WORKPLACE_CONTRACT_01.md'
